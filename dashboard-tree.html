*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#0b0a0f;color:#e0dcd0;min-height:100vh}
.header{background:linear-gradient(180deg,rgba(139,92,246,0.15),transparent);padding:24px 32px 16px;border-bottom:1px solid rgba(255,255,255,0.06)}
.header h1{font-size:28px;color:#f2f0f7;margin-bottom:4px}
.header .sub{font-size:13px;color:rgba(242,240,247,0.45)}
.tree{padding:20px 32px;max-width:960px}
.branch{margin-left:0}
.node{cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:8px;transition:background .15s;user-select:none}
.node:hover{background:rgba(255,255,255,0.04)}
.node .icon{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.node .label{font-size:15px;flex:1}
.node .label a{color:#a78bfa;text-decoration:none}
.node .label a:hover{text-decoration:underline;color:#c4b5fd}
.node .status{font-size:11px;padding:2px 8px;border-radius:10px;white-space:nowrap}
.status-done{background:rgba(34,197,94,0.15);color:#4ade80}
.status-progress{background:rgba(139,92,246,0.15);color:#a78bfa}
.status-blocked{background:rgba(239,68,68,0.15);color:#f87171}
.status-pending{background:rgba(255,255,255,0.06);color:rgba(242,240,247,0.4)}
.node .count{font-size:12px;color:rgba(242,240,247,0.3)}
.node .info{font-size:12px;color:rgba(242,240,247,0.25)}
.node.leaf .label{font-size:14px;color:rgba(242,240,247,0.8)}
.node.leaf.has-link .label{cursor:pointer}
.node.leaf.has-link:hover{background:rgba(139,92,246,0.08)}
.children{margin-left:32px;border-left:1px solid rgba(255,255,255,0.06);overflow:hidden;transition:max-height .3s ease}
.children.collapsed{max-height:0}
.children.expanded{max-height:3000px}
.footer{padding:20px 32px;font-size:11px;color:rgba(242,240,247,0.2);border-top:1px solid rgba(255,255,255,0.04);margin-top:40px}
.tip{font-size:12px;color:rgba(242,240,247,0.3);padding:2px 10px;font-style:italic}

const STATUS = {done:"✅",progress:"🔜",blocked:"⚠️",pending:"○"};
const STATUS_CLASS = {done:"status-done",progress:"status-progress",blocked:"status-blocked",pending:"status-pending"};

function buildTree(node, depth) {
  depth = depth || 0;
  var div = document.createElement('div');
  div.className = 'branch';
  
  var row = document.createElement('div');
  var hasChildren = node.children && node.children.length > 0;
  var hasFile = node.file && !hasChildren;
  row.className = 'node' + (hasChildren ? '' : ' leaf') + (hasFile ? ' has-link' : '');
  
  var labelHtml = node.label;
  if (hasFile) {
    labelHtml = '<a href="file:///D:/Hermes/xiaonan-memory/' + node.file + '" target="_blank" onclick="event.stopPropagation()">' + node.label + ' ↗</a>';
  }
  if (node.info) labelHtml += ' <span class="tip">' + node.info + '</span>';
  
  row.innerHTML =
    '<span class="icon">' + (node.icon||'') + '</span>' +
    '<span class="label">' + labelHtml + '</span>' +
    (node.count ? '<span class="count">' + node.count + '</span>' : '') +
    '<span class="status ' + (STATUS_CLASS[node.status]||'status-pending') + '">' + (STATUS[node.status]||'○') + ' ' + (node.status==='done'?'完成':node.status==='progress'?'进行中':node.status==='blocked'?'卡住':'待办') + '</span>';
  
  div.appendChild(row);
  
  if (hasChildren) {
    var children = document.createElement('div');
    children.className = 'children expanded';
    for (var i = 0; i < node.children.length; i++) {
      children.appendChild(buildTree(node.children[i], depth+1));
    }
    div.appendChild(children);
    row.addEventListener('click', function(e) {
      e.stopPropagation();
      if (children.classList.contains('expanded')) {
        children.classList.remove('expanded');
        children.classList.add('collapsed');
      } else {
        children.classList.remove('collapsed');
        children.classList.add('expanded');
      }
    });
  }
  
  return div;
}

function countNodes(node) {
  var n = 1;
  if (node.children) for (var i = 0; i < node.children.length; i++) n += countNodes(node.children[i]);
  return n;
}

document.getElementById('tree').appendChild(buildTree(DATA));
