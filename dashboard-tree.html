.node.leaf.has-link .label{cursor:pointer}
.node.leaf.has-link:hover{background:rgba(139,92,246,0.08)}
.children{margin-left:32px;border-left:1px solid rgba(255,255,255,0.06);overflow:hidden;transition:max-height .3s ease}
.children.collapsed{max-height:0}
.children.expanded{max-height:3000px}
.modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);z-index:100;align-items:center;justify-content:center}
.modal.show{display:flex}
.modal-box{background:#121116;border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:28px;max-width:600px;width:90%;max-height:70vh;overflow-y:auto}
.modal-box h2{font-size:18px;margin-bottom:12px;color:#f2f0f7}
.modal-box p{font-size:14px;line-height:1.7;color:rgba(242,240,247,0.7);margin-bottom:8px}
.modal-box a{color:#a78bfa}
.modal-close{float:right;cursor:pointer;font-size:20px;color:rgba(242,240,247,0.4);background:none;border:none;padding:4px 8px}

// ============================================================
// 渲染逻辑（不用改）
// ============================================================
const STATUS = {done:"✅",progress:"🔜",blocked:"⚠️",pending:"○"};
const STATUS_CLASS = {done:"status-done",progress:"status-progress",blocked:"status-blocked",pending:"status-pending"};
const REPO = "D:\\Hermes\\xiaonan-memory\\";

function openLink(link) {
  if (!link) return;
  const modal = document.getElementById('modal');
  const content = document.getElementById('modalContent');
  // Try to open file:// or just show link
  content.innerHTML = `<h2>📄 详情</h2><p>文件路径：<br><code>${REPO}${link}</code></p><p>在 git 仓库中打开此文件查看完整内容。</p>`;
  modal.classList.add('show');
}

function buildTree(node, depth=0) {
  const div = document.createElement('div');
  div.className = 'branch';
  
  const row = document.createElement('div');
  const hasChildren = node.children && node.children.length > 0;
  const hasLink = node.link && !hasChildren;
  row.className = 'node' + (hasChildren ? '' : ' leaf') + (hasLink ? ' has-link' : '');
  
  let labelHtml = node.label;
  if (hasLink) labelHtml = `<span style="color:#a78bfa;cursor:pointer">${node.label} ↗</span>`;
  if (node.info) labelHtml += ` <span class="tip">${node.info}</span>`;
  
  row.innerHTML = `
    <span class="icon">${node.icon||''}</span>
    <span class="label">${labelHtml}</span>
    ${node.count ? `<span class="count">${node.count}</span>` : ''}
    <span class="status ${STATUS_CLASS[node.status]||'status-pending'}">${STATUS[node.status]||'○'} ${node.status==='done'?'完成':node.status==='progress'?'进行中':node.status==='blocked'?'卡住':'待办'}</span>
  `;
  
  div.appendChild(row);
  
  if (hasLink) {
    row.addEventListener('click', (e) => { e.stopPropagation(); openLink(node.link); });
  }
  
  if (hasChildren) {
    const children = document.createElement('div');
    children.className = 'children expanded';
    node.children.forEach(child => children.appendChild(buildTree(child, depth+1)));
    div.appendChild(children);
    
    row.addEventListener('click', (e) => {
      e.stopPropagation();
      children.classList.toggle('expanded');
      children.classList.toggle('collapsed');
    });
  }
  
  return div;
}

function countNodes(node) {
  let n = 1;
  if (node.children) node.children.forEach(c => n += countNodes(c));
  return n;
}
