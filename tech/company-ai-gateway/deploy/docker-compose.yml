# New API · 公司 AI 网关
# 底稿：官方 docker-compose.yml（github.com/QuantumNous/new-api）
# 改动：① 所有默认弱密码 → 部署时脚本替换为随机强密码
#       ② 补 SESSION_SECRET（官方 README 要求设置持久随机串）
#       ③ 未对外暴露 postgres / redis 端口
#
# ⚠️ 本文件里的 __PG_PASS__ / __REDIS_PASS__ / __SESSION_SECRET__ 是占位符，
#    由 deploy/bootstrap.sh 在部署时替换为真实随机值，不要直接 up。

services:
  new-api:
    image: calciumion/new-api:latest
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://newapi:__PG_PASS__@postgres:5432/new-api
      - REDIS_CONN_STRING=redis://:__REDIS_PASS__@redis:6379
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true
      - BATCH_UPDATE_ENABLED=true
      - NODE_NAME=company-gw-1
      - SESSION_SECRET=__SESSION_SECRET__
    depends_on:
      - redis
      - postgres
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "__REDIS_PASS__"]
    networks:
      - new-api-network

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: newapi
      POSTGRES_PASSWORD: __PG_PASS__
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - new-api-network

networks:
  new-api-network:

volumes:
  pg_data:
